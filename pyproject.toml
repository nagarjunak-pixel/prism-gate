[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "prism-gate"
version = "1.0.0"
description = "High-Throughput Multi-Tenant LLM Inference Gateway with TCP-Vegas Adaptive Concurrency Control, Speculative Cascade Routing, Online Claim-Faithfulness Verification, and PSI/Jensen-Shannon Drift Detection."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
authors = [
  { name = "Nagarjuna Kamireddy", email = "sendemailtonagarjuna@gmail.com" },
]
keywords = [
  "llm-gateway",
  "ai-infrastructure",
  "adaptive-concurrency",
  "tcp-vegas",
  "cascade-routing",
  "semantic-cache",
  "hallucination-detection",
  "drift-detection",
  "jensen-shannon",
  "finops",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
  "pydantic>=2.7",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "rich>=13.7",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "mypy>=1.11",
]

[project.urls]
Homepage = "https://github.com/nagarjunak-pixel/prism-gate"
Repository = "https://github.com/nagarjunak-pixel/prism-gate"
Documentation = "https://github.com/nagarjunak-pixel/prism-gate/tree/main/docs"
Issues = "https://github.com/nagarjunak-pixel/prism-gate/issues"

[project.scripts]
prism = "prism_gate.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/prism_gate"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "W",
  "I",
  "B",
  "UP",
  "N",
  "SIM",
  "C4",
  "RUF",
]
ignore = [
  "B008", # FastAPI/Typer Depends/Option in function defaults
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
mypy_path = "src"
packages = ["prism_gate"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["prism_gate"]
branch = true
omit = [
  "src/prism_gate/__main__.py",
]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]
